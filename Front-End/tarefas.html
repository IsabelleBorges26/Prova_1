<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Gerenciamento de Tarefas</h1>
        <nav>
            <a href="usuarios.html">Cadastro de Usuários</a>
            <a href="tarefas.html">Cadastro de Tarefas</a>
            <a href="index.html">Gerenciar Tarefas</a>
        </nav>
    </header>

    <main>
        <h2>Cadastro de Tarefas</h2>
        <form id="formTarefa">
            <label>Descrição:</label>
            <input type="text" id="descricao" required>

            <label>Setor:</label>
            <input type="text" id="setor" required>

            <label>Usuário:</label>
            <select id="usuario" required>
                <option value="">Selecione um usuário</option>
            </select>

            <label>Prioridade:</label>
            <select id="prioridade" required>
                <option value="BAIXA">Baixa</option>
                <option value="MEDIA">Média</option>
                <option value="ALTA">Alta</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>
    </main>

    <script>
        const api = 'http://localhost:3000';
        const form = document.getElementById('formTarefa');
        const idTarefa = new URLSearchParams(window.location.search).get('id');

        carregarDados();

        async function carregarDados() {
            const respUsuarios = await fetch(`${api}/usuarios`);
            const usuarios = await respUsuarios.json();
            const select = document.getElementById('usuario');

            usuarios.forEach(u => {
                select.innerHTML += `<option value="${u.id}">${u.nome}</option>`;
            });

            if (idTarefa) {
                const respTarefa = await fetch(`${api}/tarefas/${idTarefa}`);
                const t = await respTarefa.json();
                document.getElementById('descricao').value = t.descricao;
                document.getElementById('setor').value = t.setor;
                document.getElementById('usuario').value = t.usuarioId;
                document.getElementById('prioridade').value = t.prioridade;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                descricao: document.getElementById('descricao').value,
                setor: document.getElementById('setor').value,
                usuarioId: Number(document.getElementById('usuario').value),
                prioridade: document.getElementById('prioridade').value
            };

            let url = `${api}/tarefas`;
            let metodo = 'POST';

            if (idTarefa) {
                url = `${api}/tarefas/${idTarefa}`;
                metodo = 'PUT';
            }

            const resposta = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                alert('cadastro concluído com sucesso');
                if (idTarefa) {
                    window.location.href = 'index.html';
                } else {
                    form.reset();
                }
            } else {
                const erro = await resposta.json();
                alert(erro.error);
            }
        });
    </script>
</body>

</html>
